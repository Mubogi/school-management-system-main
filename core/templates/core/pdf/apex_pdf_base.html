{% comment %}Apex PDF base — shared WeasyPrint-compatible stylesheet + helpers.
Include once per PDF template via {% include 'core/pdf/apex_pdf_base.html' %}
Variables expected: school (SchoolConfiguration), school_logo_uri (str, optional).
Renders only <style>; safe to include inside a template that already has <head>.{% endcomment %}
<style>
  @page {
    size: A4;
    margin: 14mm 12mm;
    @bottom-center {
      content: "{{ school.school_name|default:'School' }} · Generated by Apex OS Engine";
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 8pt;
      color: #94a3b8;
    }
  }
  :root {
    --apex-primary: #4f46e5;
    --apex-violet: #7c3aed;
    --apex-pink: #db2777;
    --apex-ink: #0f172a;
    --apex-slate: #334155;
    --apex-muted: #64748b;
    --apex-line: #e2e8f0;
    --apex-soft: #f8fafc;
    --apex-green: #15803d;
    --apex-green-bg: #dcfce7;
    --apex-amber: #a16207;
    --apex-amber-bg: #fef9c3;
    --apex-indigo-bg: #e0e7ff;
    --apex-indigo: #4338ca;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: 'Plus Jakarta Sans', 'DejaVu Sans', sans-serif;
    color: var(--apex-ink);
    font-size: 11pt;
  }
  .mono { font-family: 'JetBrains Mono', 'DejaVu Sans Mono', monospace; }

  /* Apex logo badge (gradient square with shield glyph) */
  .apex-logo-badge {
    width: 54px; height: 54px; border-radius: 13px;
    background: linear-gradient(135deg, var(--apex-primary) 0%, var(--apex-violet) 50%, var(--apex-pink) 100%);
    color: #fff; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .apex-logo-badge svg { width: 30px; height: 30px; }

  /* School crest when a real logo file is present */
  .apex-logo-img { width: 54px; height: 54px; object-fit: contain; border-radius: 12px; }

  .apex-id-tag {
    font-family: 'JetBrains Mono', monospace; background: var(--apex-line);
    color: var(--apex-slate); padding: 3px 7px; border-radius: 5px;
    font-size: 9pt; font-weight: 700; display: inline-block;
  }
  .apex-id-tag.indigo { background: var(--apex-indigo-bg); color: var(--apex-indigo); }
  .apex-id-tag.primary { background: var(--apex-primary); color: #fff; }
  .apex-id-tag.sky { background: #e0f2fe; color: #0369a1; }

  /* Watermark — rotated school name behind the document */
  .apex-watermark {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%) rotate(-25deg);
    font-size: 54pt; font-weight: 800; letter-spacing: 4px;
    color: var(--apex-primary); opacity: 0.04;
    pointer-events: none; user-select: none; white-space: nowrap;
    z-index: 0; text-transform: uppercase;
  }
  .apex-watermark-glyph {
    position: absolute; top: 46%; left: 50%;
    transform: translate(-50%, -50%);
    opacity: 0.035; pointer-events: none; z-index: 0;
  }
  .apex-watermark-glyph svg { width: 280px; height: 280px; color: var(--apex-primary); }

  .apex-z { position: relative; z-index: 2; }

  /* Marks table — dark header + zebra rows */
  .apex-table { width: 100%; border-collapse: collapse; }
  .apex-table th {
    background: #1e293b; color: #fff; font-size: 8.5pt; font-weight: 700;
    text-transform: uppercase; padding: 9px 11px; text-align: left;
  }
  .apex-table th:first-child { border-top-left-radius: 6px; }
  .apex-table th:last-child { border-top-right-radius: 6px; text-align: center; }
  .apex-table td {
    padding: 9px 11px; font-size: 9.5pt; border-bottom: 1px solid var(--apex-line);
    color: var(--apex-slate);
  }
  .apex-table tr:nth-child(even) td { background: var(--apex-soft); }

  .apex-grade-pill {
    padding: 3px 8px; border-radius: 5px; font-weight: 800; font-size: 9pt;
    font-family: 'JetBrains Mono', monospace; display: inline-block;
  }
  .g-d1, .g-d2 { background: var(--apex-green-bg); color: var(--apex-green); }
  .g-d2 { background: var(--apex-indigo-bg); color: var(--apex-indigo); }
  .g-c3, .g-c4 { background: var(--apex-amber-bg); color: var(--apex-amber); }
  .g-c5, .g-c6 { background: #ffedd5; color: #c2410c; }
  .g-p7, .g-p8 { background: #fee2e2; color: #b91c1c; }
  .g-f9 { background: #fecaca; color: #991b1b; }

  .apex-summary-box {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
    background: var(--apex-soft); border: 1px dashed #cbd5e1;
    padding: 13px; border-radius: 9px;
  }
  .apex-summary-box .label { font-size: 8pt; color: var(--apex-muted); font-weight: 700; text-transform: uppercase; }
  .apex-summary-box .value { font-size: 13pt; font-weight: 800; color: var(--apex-ink); }
  .apex-summary-box .value.primary { color: var(--apex-primary); }
  .apex-summary-box .value.green { color: var(--apex-green); }

  .apex-divider { border: none; border-top: 3px double var(--apex-line); margin: 16px 0; }
  .apex-divider.thin { border-top: 1px solid var(--apex-line); }
</style>

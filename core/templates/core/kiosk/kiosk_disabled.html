{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parent Kiosk - Unavailable</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <script>
      (function(){try{var t=localStorage.getItem('theme');if(t!=='light'&&t!=='dark'){t='dark';}document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="{% static "core/css/apex-theme.css" %}" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .lock-icon {
            font-size: 4rem;
            color: #6c757d;
        }

        /* ---------- Apex dark-mode overrides ---------- */
        [data-theme="dark"] body {
            background: linear-gradient(135deg, #0b1220 0%, #111827 100%);
        }
        [data-theme="dark"] .card {
            background: #0e1526;
            color: #e2e8f0;
        }
        [data-theme="dark"] .lock-icon { color: #94a3b8; }
    </style>
</head>
<body>
    <!-- Floating Apex theme toggle -->
    <button type="button" class="apex-theme-toggle" data-apex-toggle title="Toggle light / dark theme" aria-label="Toggle theme" style="position:fixed;top:18px;right:18px;z-index:1000;">
      <i class="bi bi-brightness-high" id="themeIcon"></i>
    </button>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card border-0">
                    <div class="card-body text-center p-5">
                        <i class="bi bi-shield-lock lock-icon mb-4"></i>
                        <h2 class="mb-3">Parent Portal Currently Unavailable</h2>
                        <p class="text-muted mb-4">
                            This feature is not enabled on your school's license. 
                            Please contact your school administrator for assistance.
                        </p>
                        <a href="/" class="btn btn-primary btn-lg">
                            <i class="bi bi-house me-2"></i>Go to School Website
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="{% static 'core/js/apex-theme.js' %}"></script>
</body>
</html>

{% extends 'core/base.html' %}
{% block content %}
<div class="bg-white p-6 rounded shadow">
  <h1 class="text-2xl font-bold mb-4">Director of Studies (DOS)</h1>
  <div>
    <h2 class="font-semibold">Classes</h2>
    <ul class="mt-2">
      {% for c in classes %}
        <li>{{ c.current_class }}</li>
      {% empty %}
        <li>No classes found.</li>
      {% endfor %}
    </ul>
  </div>
</div>
{% endblock %}

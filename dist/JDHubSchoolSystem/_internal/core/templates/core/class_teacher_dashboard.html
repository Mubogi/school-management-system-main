{% extends 'core/base.html' %}
{% block content %}
<div class="bg-white p-6 rounded shadow">
  <h1 class="text-2xl font-bold mb-4">Class Teacher Dashboard</h1>
  <div>
    <h2 class="font-semibold">Students in your classes</h2>
    <ul class="mt-2">
      {% for s in students %}
        <li>{{ s.student_id }} - {{ s.first_name }} {{ s.last_name }}</li>
      {% empty %}
        <li>No students assigned yet.</li>
      {% endfor %}
    </ul>
  </div>
</div>
{% endblock %}

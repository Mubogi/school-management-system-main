{% extends 'school/base.html' %}

{% block content %}
<h2>Timetables</h2>
<a href="{% url 'timetable_create' %}" class="btn btn-primary mb-3">Upload Timetable</a>
<ul class="list-group">
    {% for timetable in timetables %}
    <li class="list-group-item">
        <h5>{{ timetable.title }}</h5>
        <a href="{{ timetable.file.url }}" class="btn btn-link" download>Download</a>
        <small>{{ timetable.uploaded_at }}</small>
    </li>
    {% empty %}
    <li class="list-group-item">No timetables uploaded.</li>
    {% endfor %}
</ul>
{% endblock %}

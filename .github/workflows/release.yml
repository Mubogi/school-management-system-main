name: Release offline edition

# Publishing a version tag (e.g. v1.1.0) builds the Windows installer and the
# Android APK, then attaches them to a GitHub Release so clients can download
# them from the Releases page. Manual runs (workflow_dispatch) build the same
# assets and upload them as workflow artifacts without creating a Release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-pc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Django checks
        run: python manage.py check

      - name: Build executable, portable zip and installer
        run: python build.py --clean --zip --installer

      - name: Assemble release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item "dist/JDHubSchoolSystem-windows-portable.zip" "release-assets/"
          $setup = Get-ChildItem "installer/JDHub_SchoolManagement_Offline_*_Setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "Installer .exe not found in installer/" }
          Copy-Item $setup.FullName "release-assets/"
          Get-ChildItem "release-assets" | Format-Table Name, Length

      - name: Write checksums
        shell: pwsh
        run: |
          Get-ChildItem release-assets -File | Where-Object { $_.Name -notlike 'SHA256SUMS*' } | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)"
          } | Set-Content release-assets/SHA256SUMS-windows.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-pc
          path: release-assets/*

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true

  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate brand icons
        run: python -m pip install --quiet pillow && python tools/generate_brand_icons.py

      - name: Configure APK signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android-apk
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
            SP="$ANDROID_STORE_PASSWORD"; KA="$ANDROID_KEY_ALIAS"; KP="$ANDROID_KEY_PASSWORD"
          else
            echo "No signing secret configured - generating an ephemeral key."
            keytool -genkeypair -v -keystore release.keystore -alias jdhub \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass jdhub-offline -keypass jdhub-offline \
              -dname "CN=JD Hub School, O=Jordan Design Hub, C=UG"
            SP="jdhub-offline"; KA="jdhub"; KP="jdhub-offline"
          fi
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=${SP}
          keyAlias=${KA}
          keyPassword=${KP}
          EOF
          # Export for the explicit re-signing step below.
          {
            echo "JDHUB_KEYSTORE=$PWD/release.keystore"
            echo "JDHUB_STORE_PASS=${SP}"
            echo "JDHUB_KEY_ALIAS=${KA}"
            echo "JDHUB_KEY_PASS=${KP}"
          } >> "$GITHUB_ENV"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          # Pin the Gradle version: Chaquopy 16.1 uses org.gradle.util.VersionNumber,
          # which Gradle 9 removed, so the runner's default Gradle fails to configure.
          gradle-version: '8.7'

      - name: Build signed release APK
        run: |
          cd android-apk
          chmod +x build_apk.sh
          ./build_apk.sh

      - name: Sign APK (v1 + v2 schemes)
        run: |
          mkdir -p release-assets
          BT="$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)"
          APKSIGNER="$ANDROID_HOME/build-tools/$BT/apksigner"
          # Re-sign explicitly with both schemes: v2 alone is rejected by
          # Android 6 and older ("problem parsing the package"), which is the
          # failure clients reported.
          "$APKSIGNER" sign \
            --ks "$JDHUB_KEYSTORE" \
            --ks-key-alias "$JDHUB_KEY_ALIAS" \
            --ks-pass "pass:$JDHUB_STORE_PASS" \
            --key-pass "pass:$JDHUB_KEY_PASS" \
            --min-sdk-version 23 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --out release-assets/JDHubSchoolOffline.apk \
            android-apk/app/build/outputs/apk/release/app-release.apk

      - name: Verify APK is signed (v1 + v2)
        run: |
          APK=release-assets/JDHubSchoolOffline.apk
          BT="$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)"
          APKSIGNER="$ANDROID_HOME/build-tools/$BT/apksigner"
          "$APKSIGNER" verify --print-certs "$APK" || \
            (echo "APK is NOT signed - clients would see 'error parsing package'" >&2 && exit 1)
          "$APKSIGNER" verify -v "$APK" | tee /tmp/apksigner.txt
          grep -q "Verified using v1 scheme.*true" /tmp/apksigner.txt || \
            (echo "APK is missing the v1 signature - Android 6 and older will reject it" >&2 && exit 1)
          grep -q "Verified using v2 scheme.*true" /tmp/apksigner.txt || \
            (echo "APK is missing the v2 signature" >&2 && exit 1)

      - name: Write checksums
        run: |
          cd release-assets
          sha256sum JDHubSchoolOffline.apk > SHA256SUMS-apk.txt
          cat SHA256SUMS-apk.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: release-assets/*

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*

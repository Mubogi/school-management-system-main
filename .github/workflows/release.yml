name: Release offline edition

# Publishing a version tag (e.g. v1.1.0) builds the Windows installer and the
# Android APK, then attaches them to a GitHub Release so clients can download
# them from the Releases page. Manual runs (workflow_dispatch) build the same
# assets and upload them as workflow artifacts without creating a Release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-pc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Django checks
        run: python manage.py check

      - name: Build executable, portable zip and installer
        run: python build.py --clean --zip --installer

      - name: Assemble release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item "dist/JDHubSchoolSystem-windows-portable.zip" "release-assets/"
          $setup = Get-ChildItem "installer/JDHub_SchoolManagement_Offline_*_Setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "Installer .exe not found in installer/" }
          Copy-Item $setup.FullName "release-assets/"
          Get-ChildItem "release-assets" | Format-Table Name, Length

      - name: Write checksums
        shell: pwsh
        run: |
          Get-ChildItem release-assets -File | Where-Object { $_.Name -notlike 'SHA256SUMS*' } | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)"
          } | Set-Content release-assets/SHA256SUMS-windows.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-pc
          path: release-assets/*

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true

  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generate brand icons
        run: python -m pip install --quiet pillow && python tools/generate_brand_icons.py

      - name: Configure APK signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android-apk
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
            cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=${ANDROID_STORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF
          else
            echo "No signing secret configured - generating an ephemeral key."
            keytool -genkeypair -v -keystore release.keystore -alias jdhub \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass jdhub-offline -keypass jdhub-offline \
              -dname "CN=JD Hub School, O=Jordan Design Hub, C=UG"
            cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=jdhub-offline
          keyAlias=jdhub
          keyPassword=jdhub-offline
          EOF
          fi

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          # Pin the Gradle version: Chaquopy 16.1 uses org.gradle.util.VersionNumber,
          # which Gradle 9 removed, so the runner's default Gradle fails to configure.
          gradle-version: '8.7'

      - name: Build signed release APK
        run: |
          cd android-apk
          chmod +x build_apk.sh
          ./build_apk.sh

      - name: Collect and verify APK
        run: |
          mkdir -p release-assets
          cp android-apk/app/build/outputs/apk/release/app-release.apk release-assets/JDHubSchoolOffline.apk
          ls -la release-assets
          BT="$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)"
          APKSIGNER="$ANDROID_HOME/build-tools/$BT/apksigner"
          "$APKSIGNER" verify --print-certs release-assets/JDHubSchoolOffline.apk || \
            (echo "APK is NOT signed - clients would see 'error parsing package'" >&2 && exit 1)

      - name: Write checksums
        run: |
          cd release-assets
          sha256sum JDHubSchoolOffline.apk > SHA256SUMS-apk.txt
          cat SHA256SUMS-apk.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: release-assets/*

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*

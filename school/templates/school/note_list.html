{% extends 'school/base.html' %}

{% block content %}
<h2>Notes</h2>
<a href="{% url 'note_create' %}" class="btn btn-primary mb-3">Upload Note</a>
<ul class="list-group">
    {% for note in notes %}
    <li class="list-group-item">
        <h5>{{ note.title }}</h5>
        <a href="{{ note.file.url }}" class="btn btn-link" download>Download</a>
        <small>{{ note.uploaded_at }}</small>
    </li>
    {% empty %}
    <li class="list-group-item">No notes uploaded.</li>
    {% endfor %}
</ul>
{% endblock %}

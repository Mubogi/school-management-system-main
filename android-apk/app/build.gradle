plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.jordandesignhub.school'
    compileSdk 34

    defaultConfig {
        applicationId "com.jordandesignhub.school"
        minSdk 24
        targetSdk 34
        versionCode 7
        versionName "1.2.5"

        ndk {
            // The embedded Python interpreter is native code. Real phones are
            // arm64-v8a (current) or armeabi-v7a (older/cheaper); the x86_64
            // ABI is only needed for emulators and costs ~14 MB, so it is left
            // out to keep the download small.
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
        python {
            // Pure-Python packages are enough for the full app; reportlab is
            // native and not available for Android, so PDFs use the bundled
            // pure-Python fpdf2 fallback instead.
            pip {
                install "django==4.2.16"
                install "whitenoise==6.7.0"
                install "qrcode==7.4.2"
                install "pypdf==4.3.1"
                install "fpdf2==2.7.9"
                install "pillow"  // QR PNG rendering + fpdf2 image support
            }
        }
    }

    // Release signing is optional: drop a keystore.properties file at the
    // project root to produce a signed release build; otherwise the APK is
    // unsigned and Android will ask the user to allow the install.
    def keystorePropsFile = rootProject.file("keystore.properties")
    if (keystorePropsFile.exists()) {
        def keystoreProps = new Properties()
        keystorePropsFile.withInputStream { keystoreProps.load(it) }
        signingConfigs {
            release {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
                // minSdk is 24, so every installable device supports the v2
                // scheme; the v1/JAR scheme is only needed below API 24.
                enableV2Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        // Pin the Python version so the CI build machine and the APK agree.
        version = "3.11"
    }
}

// --- Bundle the Django project into the APK assets -------------------------
// The Android edition runs the *same* Python source as the desktop edition.
// Gradle copies the source tree plus templates/static/migrations into
// src/main/assets/jdhub, which MainActivity extracts to files on first run.
def appProjectRoot = rootProject.projectDir.parentFile
def androidAssetsDir = file("$projectDir/src/main/assets/jdhub")
def sourcePackages = ["django_sms", "core", "school", "licensing", "notifications", "utils"]

tasks.register("copyAndroidSources", Sync) {
    into androidAssetsDir
    // Copy relative to the project root so package folders (core/, school/…)
    // keep their names and imports keep working on the device. Templates and
    // static files live inside these packages, so they come along too.
    from(appProjectRoot) {
        sourcePackages.each { pkg -> include "${pkg}/**" }
        include "images/**"
        exclude "**/__pycache__/**"
        exclude "**/*.pyc"
    }
}

tasks.named("preBuild") { dependsOn "copyAndroidSources" }

dependencies {
    // Aligns the Kotlin stdlib that zxing pulls in (jdk7/jdk8 1.6.21) with the
    // version androidx brings (1.8.22). Since Kotlin 1.8 the jdk7/jdk8 artifacts
    // are empty shims of kotlin-stdlib, so without this the build fails with
    // "Duplicate class kotlin.*" errors.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
